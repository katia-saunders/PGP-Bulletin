<style>
  :root{
    --ink:#2c3a56;
    --paper:#f7f3ea;
    --card:#ffffff;
    --yellow:#aab8d6;
    --coral:#9c3f36;
    --teal:#42537a;
    --line:#e3ddca;
    --muted:#78725f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    min-height:100vh;
    padding-bottom:48px;
  }
  h1,h2,h3,.display{font-family:inherit;}

  header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px 20px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-1px; height:14px;
    background:var(--paper);
    clip-path: polygon(0 100%,3% 0,6% 100%,9% 0,12% 100%,15% 0,18% 100%,21% 0,24% 100%,27% 0,30% 100%,33% 0,36% 100%,39% 0,42% 100%,45% 0,48% 100%,51% 0,54% 100%,57% 0,60% 100%,63% 0,66% 100%,69% 0,72% 100%,75% 0,78% 100%,81% 0,84% 100%,87% 0,90% 100%,93% 0,96% 100%,99% 0,100% 100%);
  }
  .header-top{display:flex; align-items:center; gap:9px; margin-bottom:1px;}
  .crest{width:30px; height:auto; flex-shrink:0; display:block;}

  .eyebrow{
    font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--yellow); font-weight:600; margin:0;
  }
  .datehead{font-size:24px; font-weight:700; margin:0; line-height:1.15;}
  .term-sub{font-size:13px; color:#cfd8d6; margin-top:4px;}
  .term-note{font-size:12.5px; color:var(--yellow); margin-top:5px; font-weight:600;}

  .testbar{
    max-width:520px; margin:20px auto 24px; padding:10px 14px;
    border:1px dashed #c7bd9f; border-radius:12px; background:#f3ecd8;
    font-size:12.5px; color:var(--muted);
  }
  .testbar summary.testbar-label{
    font-weight:700; color:var(--ink); cursor:pointer; list-style:none;
  }
  .testbar summary.testbar-label::-webkit-details-marker{display:none;}
  .testbar[open] summary.testbar-label{margin-bottom:10px;}
  .testbar-row{display:flex; gap:8px; flex-wrap:wrap;}
  .testbar-row input{
    flex:1; min-width:170px; font-family:inherit; font-size:13px;
    padding:6px 8px; border:1px solid var(--line); border-radius:8px; background:white; color:var(--ink);
  }
  .testbar-row button{
    font-family:inherit; font-size:13px; font-weight:600; padding:6px 12px;
    border-radius:8px; border:1px solid var(--teal); background:var(--teal); color:white; cursor:pointer;
  }
  .testbar-row button#resetBtn{background:white; color:var(--teal);}
  .testbar-status{display:block; margin-top:6px; font-style:italic;}

  main{padding:16px 16px 8px; max-width:520px; margin:0 auto;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:15px; margin:0 0 10px; color:var(--teal);
    text-transform:uppercase; letter-spacing:.04em; font-weight:700;
  }
  .card-head{
    display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px;
  }
  .card-head h2{margin:0 0 10px; flex:1 1 100%;}
  .ics-wrap{position:relative; flex-shrink:0; margin:-6px 0 8px auto;}
  .ics-btn{
    font-family:inherit; font-size:12px; font-weight:700;
    color:white; background:var(--teal); border:none; border-radius:999px;
    padding:6px 12px; cursor:pointer; white-space:nowrap;
  }
  .ics-btn:active{opacity:.85;}
  .ics-menu{
    position:absolute; right:0; top:calc(100% + 6px); z-index:20;
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 6px 18px rgba(30,25,10,.14); padding:5px; min-width:160px;
    display:flex; flex-direction:column; gap:1px;
  }
  .ics-menu[hidden]{display:none;}
  .ics-menu button{
    font-family:inherit; font-size:13px; font-weight:600; color:var(--ink);
    background:none; border:none; text-align:left; padding:8px 10px;
    border-radius:7px; cursor:pointer;
  }
  .ics-menu button:active{background:var(--paper);}

  .alert{
    background:#f6e7e4; border:1px solid #d9b3ac; color:#7a332b;
    border-radius:12px; padding:12px 14px; margin-bottom:12px;
    font-size:14px; font-weight:600; display:flex; gap:10px; align-items:flex-start;
  }
  .alert .ico{font-size:18px; line-height:1.3;}

  .offday{
    text-align:center; padding:22px 10px;
  }
  .offday .big{font-size:38px; margin-bottom:6px;}
  .offday h2{font-size:20px; color:var(--ink); text-transform:none; letter-spacing:0;}
  .offday p{color:var(--muted); font-size:14px; margin:6px 0 0;}

  .daylabel-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:22px 0 10px; padding:9px 14px; border-radius:10px;
  }
  main > .daylabel-row:first-child{margin-top:0;}
  .daylabel-row.today{background:var(--ink);}
  .daylabel-row.next{background:#e4e8f2;}
  .daylabel{
    font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  }
  .daylabel-row.today .daylabel{color:var(--paper);}
  .daylabel-row.next .daylabel{color:var(--ink);}
  .uniform-badge{
    flex-shrink:0; font-size:11px; font-weight:700; padding:4px 10px;
    border-radius:999px; background:#eee7d2; color:var(--muted); white-space:nowrap;
  }
  .uniform-badge.pe{background:#f2ddd8; color:#8a3b31;}

  details.card{padding:14px 18px;}
  details.card summary{
    list-style:none; cursor:pointer; display:flex; align-items:center;
    justify-content:space-between; gap:10px; padding:2px 0;
  }
  details.card summary::-webkit-details-marker{display:none;}
  .sm-eyebrow{font-size:11px; font-weight:700; color:var(--teal); text-transform:uppercase; letter-spacing:.04em;}
  .sm-main{font-size:15.5px; font-weight:600; color:var(--ink); margin-top:2px;}
  .chev{
    width:0; height:0; flex-shrink:0; margin-top:2px;
    border-left:5px solid transparent; border-right:5px solid transparent;
    border-top:6px solid var(--muted);
    transition:transform .15s ease;
  }
  details.card[open] .chev{transform:rotate(180deg);}

  .icn{width:16px; height:16px; flex-shrink:0; vertical-align:-3px;}
  .icn-lg{width:38px; height:38px;}
  .testbar-label{display:flex; align-items:center; gap:6px;}
  .btn-caret{
    display:inline-block; width:0; height:0; margin-left:2px;
    border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:5px solid currentColor; vertical-align:middle;
  }
  details.card > table.tt,
  details.card > .menu-body{
    margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);
  }

  table.tt{width:100%; border-collapse:collapse; font-size:14px;}
  table.tt td{padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:top;}
  table.tt tr:last-child td{border-bottom:none;}
  table.tt td.time{width:92px; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12.5px; padding-top:8px;}
  table.tt tr.now td{background:#fff8e6;}
  table.tt tr.now td.time{color:var(--coral); font-weight:700;}
  table.tt tr.now td.act{font-weight:700;}
  .tt-tag{display:inline-block; font-size:10.5px; font-weight:700; color:var(--teal); background:#e7eaf3; border-radius:6px; padding:1px 6px; margin-left:6px; vertical-align:middle;}

  .menu-row{margin-bottom:10px; font-size:14px; line-height:1.45;}
  .menu-row .lbl{display:block; font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:1px;}
  .menu-row:last-child{margin-bottom:0;}
  .menu-footnote{font-size:12px; color:var(--muted); margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .allergen-key{font-size:11px; color:var(--muted); margin-top:8px;}

  .ev{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line);}
  .ev:last-child{border-bottom:none;}
  .ev .evdate{
    flex-shrink:0; width:52px; text-align:center; background:var(--paper);
    border-radius:8px; padding:5px 2px;
  }
  .ev .evdate .n{font-size:18px; font-weight:700; line-height:1;}
  .ev .evdate .m{font-size:9.5px; text-transform:uppercase; color:var(--muted); letter-spacing:.03em;}
  .ev .body{flex:1;}
  .ev .ttl{font-size:14px; font-weight:600;}
  .ev .note{font-size:12px; color:var(--muted); margin-top:1px;}
  .ev.today .evdate{background:var(--coral); color:white;}
  .ev.today .evdate .m{color:#ffe3da;}

  footer{
    text-align:center; font-size:11.5px; color:var(--muted); padding:18px 20px 6px;
  }
  footer a{color:var(--teal);}

const DAY_KEYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAY_NAMES = {Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fromISO(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function inRange(dateStr, start, end){ return dateStr >= start && dateStr <= end; }

function schoolWeekFor(dateStr){
  return SCHOOL_WEEKS.find(w => inRange(dateStr, w.start, w.end)) || null;
}
function breakFor(dateStr){
  return BREAKS.find(b => inRange(dateStr, b.start, b.end)) || null;
}
function eventsOn(dateStr){
  return EVENTS.filter(e => inRange(dateStr, e.start, e.end));
}
function upcomingEvents(dateStr, limit){
  return EVENTS.filter(e => e.start > dateStr).sort((a,b)=>a.start<b.start?-1:1).slice(0, limit);
}
function nextSchoolDay(fromDate){
  for(let i=1;i<=45;i++){
    const d = addDays(fromDate, i);
    const s = iso(d);
    if(schoolWeekFor(s)) return d;
  }
  return null;
}
function fmtDate(d){
  return DAY_KEYS[d.getDay()]===undefined ? "" :
    `${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function fmtShort(dateStr){
  const d = fromISO(dateStr);
  return { n: d.getDate(), m: MONTHS[d.getMonth()] };
}

let previewOverride = null; // set by the test bar; a Date whose local getters = the previewed UK wall-clock time

// Returns a Date object whose local getters (getDate/getHours/etc.) equal the
// current wall-clock time in the UK, regardless of what timezone the device
// itself is set to. Constructing it this way - rather than trusting the
// device's own local time - is what makes "today" correct for a parent
// travelling abroad.
function nowUK(){
  if(previewOverride) return previewOverride;
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London", hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  }).formatToParts(new Date());
  const get = t => Number(parts.find(p => p.type === t).value);
  return new Date(get("year"), get("month")-1, get("day"), get("hour"), get("minute"), get("second"));
}

  const now = nowUK();
  const todayStr = iso(now);
  const nowHM = now.toTimeString().slice(0,5);
  const dow = DAY_KEYS[now.getDay()]; // Mon/Tue/.../Sun

  document.getElementById("termLabel").textContent = TERM.name;

  const main = document.getElementById("main");
  main.innerHTML = "";

  // outside data range entirely
  if(todayStr < TERM.start || todayStr > TERM.end){
    document.getElementById("subLabel").textContent = "";
    document.getElementById("subLabel").style.display = "none";
    document.getElementById("termNote").textContent = "";
    const beyond = todayStr > TERM.end;
    main.innerHTML = `<div class="card offday">
      <div class="big"><svg class="icn-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 9.5h18M8 13.5h.01M12 13.5h.01M16 13.5h.01M8 17h.01M12 17h.01"/></svg></div>
      <h2>${beyond ? "No data loaded for this date" : "Term hasn't started yet"}</h2>
      <p>${beyond ? `This bulletin only has ${TERM.name} loaded (through ${fmtShort(TERM.end).n} ${fmtShort(TERM.end).m}).` : `${TERM.name} begins ${fmtShort(TERM.start).n} ${fmtShort(TERM.start).m}.`}
      ${TERM.nextTermStart && beyond ? `<br>Next known start: ${fmtShort(TERM.nextTermStart).n} ${fmtShort(TERM.nextTermStart).m}.` : ""}
      Send the new term's menu, timetable and key dates whenever they land, and this gets refreshed.</p>
    </div>`;
  } else {

  const week = schoolWeekFor(todayStr);
  const brk = breakFor(todayStr);
  const subText = week ? "" : (brk ? brk.label : (dow==="Sat"||dow==="Sun" ? "Weekend" : ""));
  const subEl = document.getElementById("subLabel");

  subEl.style.display = subText ? "" : "none";
  document.getElementById("termNote").textContent = nearestTermNote(todayStr);

  // "Today" section only appears when today is an actual school day.
  if(week){
    renderDaySection(main, "Today", todayStr, now, nowHM, true);
  }

  // "Tomorrow" / "Next school day" always shows the next real school day,
  // skipping weekends and holidays regardless of what today is.
  const nsd = nextSchoolDay(now);
  if(nsd){
    const nsdStr = iso(nsd);
    const isImmediatelyTomorrow = nsdStr === iso(addDays(now,1));
    const label = isImmediatelyTomorrow ? "Tomorrow" : `Next school day &#183; ${fmtDate(nsd)}`;
    renderDaySection(main, label, nsdStr, nsd, null, false);
  } else {
    main.innerHTML += `<div class="card offday">
      <div class="big"><svg class="icn-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h13l-3 4.5L18 13H5"/></svg></div>
      <h2>End of the loaded term data</h2>
      <p>${TERM.nextTermStart ? `Next known start: ${fmtDate(fromISO(TERM.nextTermStart))}.` : ""} Send the next term's files whenever they land and this picks back up.</p>
    </div>`;
  }

  }

  // events - shown regardless of whether today falls inside the loaded term,
  // so "what's coming up" still works before term starts / after it ends.
  const todays = eventsOn(todayStr);
  const upcoming = upcomingEvents(todayStr, 8);
  if(todays.length || upcoming.length){
    let html = `<div class="card"><div class="card-head"><h2>What's coming up</h2>
      <div class="ics-wrap">
        <button type="button" class="ics-btn" id="icsBtn">Add to calendar <span class="btn-caret"></span></button>
        <div class="ics-menu" id="icsMenu" hidden>
          <button type="button" data-cat="term">Term dates only</button>
          <button type="button" data-cat="event">Key events only</button>
          <button type="button" data-cat="both">Both</button>
        </div>
      </div>
    </div>`;
    todays.forEach(e => html += eventRow(e, true));
    upcoming.forEach(e => html += eventRow(e, false));
    html += `</div>`;
    main.innerHTML += html;
  }

  document.getElementById("dataRange").textContent = `${fmtShort(TERM.start).n} ${fmtShort(TERM.start).m} - ${fmtShort(TERM.end).n} ${fmtShort(TERM.end).m} ${TERM.end.slice(0,4)}`;
}

function fmtDateShort(dateStr){
  const d = fromISO(dateStr);
  const wd = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
  const s = fmtShort(dateStr);
  return `${wd} ${s.n} ${s.m}`;
}

// A single always-visible line for the header: how far away the nearest
// half-term/holiday boundary is, or the end of term if none remain.
function nearestTermNote(todayStr){
  if(todayStr < TERM.start) return `Term begins ${fmtDateShort(TERM.start)}`;
  if(todayStr > TERM.end) return TERM.nextTermStart ? `Next term begins ${fmtDateShort(TERM.nextTermStart)}` : "";
  const active = breakFor(todayStr);
  if(active) return `${active.label} until ${fmtDateShort(active.end)}`;
  const upcoming = BREAKS.filter(b => b.start > todayStr).sort((a,b) => a.start < b.start ? -1 : 1)[0];
  if(upcoming) return `${upcoming.label}: ${fmtDateShort(upcoming.start)} - ${fmtDateShort(upcoming.end)}`;
  return `End of term: ${fmtDateShort(TERM.end)}`;
}

// ---------- Calendar export (.ics) ----------

// Correct BST/GMT offset (in minutes) for a given UK calendar date, computed
// from the real IANA rules via Intl rather than hardcoded - handles the
// clock change automatically. Uses only plain numeric date/time fields (no
// "shortOffset"/"longOffset" timeZoneName, which older Safari versions don't
// support) so this works on every browser that supports Intl timeZone at all.
function ukOffsetMinutes(dateStr){
  const [y,m,d] = dateStr.split("-").map(Number);
  const utcNoon = Date.UTC(y, m-1, d, 12, 0, 0);
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/London", hour12: false,
    year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"
  }).formatToParts(new Date(utcNoon));
  const get = t => Number(parts.find(p => p.type === t).value);
  const ukLocalAsUTC = Date.UTC(get("year"), get("month")-1, get("day"), get("hour"), get("minute"));
  return Math.round((ukLocalAsUTC - utcNoon) / 60000);
}

function ukLocalToUTC(dateStr, hh, mm){
  const offsetMin = ukOffsetMinutes(dateStr);
  const [y,m,d] = dateStr.split("-").map(Number);
  return new Date(Date.UTC(y, m-1, d, hh, mm, 0) - offsetMin*60000);
}

function icsUTC(dateObj){
  const p = n => String(n).padStart(2,"0");
  return `${dateObj.getUTCFullYear()}${p(dateObj.getUTCMonth()+1)}${p(dateObj.getUTCDate())}T${p(dateObj.getUTCHours())}${p(dateObj.getUTCMinutes())}${p(dateObj.getUTCSeconds())}Z`;
}

function icsDateOnly(dateStr){ return dateStr.replace(/-/g,""); }

function icsEscape(str){
  return String(str).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
}

function foldLine(line){
  if(line.length <= 75) return line;
  let out = line.slice(0,75), rest = line.slice(75);
  while(rest.length){ out += "\r\n " + rest.slice(0,74); rest = rest.slice(74); }
  return out;
}

// "15:00-16:15" -> {start:{h,m}, end:{h,m}}. A single time with no range
// (e.g. "09:00") gets a default 30-minute duration.
function parseTimeRange(t){
  const parts = t.split(/[--]/).map(s => s.trim()).filter(Boolean);
  const toHM = s => { const [h,m] = s.split(":").map(Number); return {h,m}; };
  const start = toHM(parts[0]);
  if(parts.length > 1) return { start, end: toHM(parts[1]) };
  const total = start.h*60 + start.m + 30;
  return { start, end: { h: Math.floor(total/60)%24, m: total%60 } };
}

function datesBetween(startStr, endStr){
  const out = [];
  let d = fromISO(startStr);
  const end = fromISO(endStr);
  while(iso(d) <= iso(end)){ out.push(iso(d)); d = addDays(d,1); }
  return out;
}

function buildICS(filterCat){
  const lines = [
    "BEGIN:VCALENDAR", "VERSION:2.0",
    "PRODID:-//Parsons Green Prep//Reception Bulletin//EN",
    "CALSCALE:GREGORIAN", "METHOD:PUBLISH"
  ];
  const dtstamp = icsUTC(new Date()); // real time, not the test-preview clock
  let n = 0;

  const items = EVENTS.filter(e => {
    const cat = e.cat || "event";
    return !filterCat || filterCat === "both" || cat === filterCat;
  });

  items.forEach(e => {
    if(e.time){
      const {start, end} = parseTimeRange(e.time);
      // A same-time event spanning several distinct days (e.g. two evenings
      // of Parents' Meetings) becomes one VEVENT per day, not one long span.
      datesBetween(e.start, e.end).forEach(dateStr => {
        lines.push("BEGIN:VEVENT");
        lines.push(`UID:pgp-reception-${dateStr}-${n++}@bulletin.local`);
        lines.push(`DTSTAMP:${dtstamp}`);
        lines.push(`DTSTART:${icsUTC(ukLocalToUTC(dateStr, start.h, start.m))}`);
        lines.push(`DTEND:${icsUTC(ukLocalToUTC(dateStr, end.h, end.m))}`);
        lines.push(`SUMMARY:${icsEscape(e.title)}`);
        if(e.note) lines.push(`DESCRIPTION:${icsEscape(e.note)}`);
        lines.push("END:VEVENT");
      });
    } else {
      lines.push("BEGIN:VEVENT");
      lines.push(`UID:pgp-reception-${e.start}-${n++}@bulletin.local`);
      lines.push(`DTSTAMP:${dtstamp}`);
      lines.push(`DTSTART;VALUE=DATE:${icsDateOnly(e.start)}`);
      lines.push(`DTEND;VALUE=DATE:${icsDateOnly(iso(addDays(fromISO(e.end), 1)))}`);
      lines.push(`SUMMARY:${icsEscape(e.title)}`);
      if(e.note) lines.push(`DESCRIPTION:${icsEscape(e.note)}`);
      lines.push("END:VEVENT");
    }
  });

  lines.push("END:VCALENDAR");
  return lines.map(foldLine).join("\r\n") + "\r\n";
}

function downloadICS(filterCat){
  const blob = new Blob([buildICS(filterCat)], {type: "text/calendar;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const suffix = filterCat === "term" ? "term-dates" : filterCat === "event" ? "key-events" : "all-dates";
  const a = document.createElement("a");
  a.href = url;
  a.download = `parsons-green-prep-reception-${suffix}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function eventRow(e, isToday){
  const s = fmtShort(e.start);
  const rangeLabel = e.end !== e.start ? `${s.n}-${fmtShort(e.end).n} ${s.m}` : `${s.n} ${s.m}`;
  return `<div class="ev${isToday?" today":""}">
    <div class="evdate"><div class="n">${s.n}</div><div class="m">${s.m}</div></div>
    <div class="body">
      <div class="ttl">${e.title}${e.time ? " &#183; " + e.time : ""}</div>
      <div class="note">${isToday ? "Today" : rangeLabel}${e.note ? " &#183; " + e.note : ""}</div>
    </div>
  </div>`;
}

function timetableHint(tt, isToday, nowHM){
  const dayStart = tt.rows[0][0], dayEnd = tt.rows[tt.rows.length-1][1];
  if(!isToday || !nowHM) return `Starts ${dayStart}`;
  if(nowHM < dayStart) return `Starts ${dayStart}`;
  if(nowHM >= dayEnd) return "Finished for the day";
  const cur = tt.rows.find(r => nowHM >= r[0] && nowHM < r[1]);
  return cur ? `Now: ${cur[2]}` : "In session";
}

function renderDaySection(main, sectionLabel, dateStr, dateObj, nowHM, isToday){
  const dow = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dateObj.getDay()];
  const tt = TIMETABLE[dow];
  const week = schoolWeekFor(dateStr);
  const menu = week ? MENUS[week.menuWeek][dow] : null;
  const uniform = UNIFORM_OVERRIDES[dateStr] || (tt ? tt.uniform : null);

  let html = `<div class="daylabel-row ${isToday ? "today" : "next"}">
      <span class="daylabel">${sectionLabel}${sectionLabel==="Today"||sectionLabel==="Tomorrow" ? " &#183; " + fmtDate(dateObj) : ""}</span>
      ${uniform ? `<span class="uniform-badge${uniform==="PE kit"?" pe":""}">${uniform}</span>` : ""}
    </div>`;

  eventsOn(dateStr).forEach(e => {
    html += `<div class="alert"><span class="ico"><svg class="icn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 0 0-12 0c0 6.5-2.5 8.5-2.5 8.5h17s-2.5-2-2.5-8.5z"/><path d="M13.7 20.5a2 2 0 0 1-3.4 0"/></svg></span><span>${e.title}${e.time ? " at " + e.time : ""}${e.note ? " - " + e.note : ""}</span></div>`;
  });

  if(tt){
    const hint = timetableHint(tt, isToday, nowHM);
    html += `<details class="card"><summary>
        <div class="sm-text"><div class="sm-eyebrow">Timetable</div><div class="sm-main">${hint}</div></div>
        <span class="chev"></span>
      </summary><table class="tt">`;
    tt.rows.forEach(r => {
      const [start,end,label,tag] = r;
      const isNow = isToday && nowHM && nowHM >= start && nowHM < end;
      html += `<tr class="${isNow?"now":""}"><td class="time">${start}</td><td class="act">${label}${tag?`<span class="tt-tag">${tag}</span>`:""}</td></tr>`;
    });
    html += `</table></details>`;
  }

  if(menu){
    html += `<details class="card"><summary>
        <div class="sm-text"><div class="sm-eyebrow">Food</div><div class="sm-main">${menu.main}</div></div>
        <span class="chev"></span>
      </summary><div class="menu-body">`;
    html += menuLine("Snack", menu.snack);
    html += menuLine("Soup", menu.soup);
    html += menuLine("Vegetarian", menu.veg);
    html += menuLine("On the side", menu.side);
    if(menu.treat) html += menuLine("Treat", menu.treat);
    html += `<div class="menu-footnote">Plus fresh fruit, yoghurt, jelly, a daily smoothie and salad bar.</div>`;
    html += `<div class="allergen-key">${ALLERGEN_KEY}</div>`;
    html += `</div></details>`;
  }

  main.innerHTML += html;
}

function menuLine(label, text){
  if(!text) return "";
  return `<div class="menu-row"><span class="lbl">${label}</span>${text}</div>`;
}

document.getElementById("main").addEventListener("click", (ev) => {
  const menu = document.getElementById("icsMenu");
  if(ev.target && ev.target.id === "icsBtn"){
    if(menu) menu.hidden = !menu.hidden;
    return;
  }
  if(ev.target && ev.target.dataset && ev.target.dataset.cat){
    downloadICS(ev.target.dataset.cat);
    if(menu) menu.hidden = true;
    return;
  }
  if(menu && !menu.hidden && !ev.target.closest(".ics-wrap")) menu.hidden = true;
});

document.getElementById("previewBtn").addEventListener("click", () => {
  const val = document.getElementById("previewInput").value;
  if(!val) return;
  const d = new Date(val); // datetime-local has no offset, so this round-trips as typed
  previewOverride = new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), 0);
  updateTestbarStatus();
  render();
});
document.getElementById("resetBtn").addEventListener("click", () => {
  previewOverride = null;
  document.getElementById("previewInput").value = "";
  updateTestbarStatus();
  render();
});
function updateTestbarStatus(){
  const el = document.getElementById("testbarStatus");
  el.textContent = previewOverride
    ? `Previewing ${fmtDate(previewOverride)}, ${String(previewOverride.getHours()).padStart(2,"0")}:${String(previewOverride.getMinutes()).padStart(2,"0")} - tap "Now" to go back to the real time.`
    : "Showing the real current UK time.";
}

render();
updateTestbarStatus();
setInterval(render, 60000);
</script>
